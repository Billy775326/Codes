name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: bash scripts/package-release.sh "$RUNNER_TEMP/assets"
      - run: bash scripts/smoke-install.sh "$RUNNER_TEMP/assets"
      - uses: actions/upload-artifact@v4
        with:
          name: codes-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            /^## / { if (selected) exit; selected = index($0, "## [" version "]") == 1; next }
            selected { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$TAG" --verify-tag --title "Codes $TAG" \
            --notes-file release-notes.md assets/*
